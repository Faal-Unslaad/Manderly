<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skarnfell - Registre du Grand Argentier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- SDK Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #120e0a;
            --wood-dark: #2a1f18;
            --wood-light: #3d2b1f;
            --parchment: #eaddcf;
            --parchment-dark: #d5c3aa;
            --gold: #c5a059;
            --gold-dim: #8b7344;
            --red-seal: #7a1b14;
            --text-dark: #2c1e16;
            --stone: #2c3539;
            --font-title: 'Cinzel', serif;
            --font-text: 'Cormorant Garamond', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-text); background-color: var(--bg-dark); color: var(--parchment); display: flex; height: 100vh; overflow: hidden; font-size: 18px; }
        .sidebar { width: 280px; background: linear-gradient(180deg, var(--wood-dark) 0%, #150f0c 100%); border-right: 2px solid var(--gold-dim); display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--gold-dim); }
        .sidebar-header h1 { font-family: var(--font-title); color: var(--gold); font-size: 24px; }
        .nav-menu { list-style: none; padding: 20px 0; flex-grow: 1; }
        .nav-item { padding: 15px 30px; cursor: pointer; font-family: var(--font-title); color: var(--parchment-dark); }
        .nav-item:hover, .nav-item.active { background-color: var(--wood-light); color: var(--gold); border-left: 4px solid var(--gold); }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #261f1a 0%, var(--bg-dark) 100%); }
        .topbar { height: 70px; background-color: var(--stone); border-bottom: 2px solid var(--gold-dim); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; }
        .content-area { padding: 40px; overflow-y: auto; flex-grow: 1; }
        .view { display: none; } .view.active { display: block; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .parchment-card { background-color: var(--parchment); color: var(--text-dark); padding: 30px; border-radius: 4px; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); border: 1px solid #d0b89a; position: relative; }
        .card-title { font-family: var(--font-title); font-size: 18px; color: var(--red-seal); border-bottom: 1px solid var(--gold-dim); padding-bottom: 10px; margin-bottom: 20px; }
        .metric-value { font-size: 36px; font-weight: bold; font-family: var(--font-title); text-align: center; }
        .houses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        .house-card { cursor: pointer; transition: transform 0.2s; }
        .house-card:hover { transform: translateY(-5px); }
        .house-header { display: flex; align-items: center; gap: 20px; }
        .seal { width: 50px; height: 50px; background-color: var(--red-seal); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--gold); font-family: var(--font-title); font-size: 24px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--parchment); color: var(--text-dark); width: 600px; padding: 40px; border: 2px solid var(--gold); position: relative; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-family: var(--font-title); font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--gold-dim); font-family: var(--font-text); font-size: 18px; }
        .btn-gold { background-color: var(--gold-dim); color: var(--bg-dark); border: none; padding: 10px 20px; font-family: var(--font-title); font-weight: bold; cursor: pointer; }
        .btn-close { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; color: var(--red-seal); cursor: pointer; }
        
        /* Banner d'erreur si la clé Supabase est manquante ou invalide */
        .error-banner { display: none; background-color: var(--red-seal); color: #fff; padding: 15px; margin-bottom: 20px; border-radius: 4px; font-family: sans-serif; font-size: 14px; }
    </style>
</head>

<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>Skarnfell</h1>
            <p>Le Grand Argentier</p>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="switchView('dashboard', this)">Tableau de Bord</li>
            <li class="nav-item" onclick="switchView('houses', this)">Maisons Nobles</li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="topbar">
            <div>Registre Connecté (PostgreSQL via Supabase)</div>
            <div style="font-family: var(--font-title); color: var(--gold);">Seigneur Baelish</div>
        </header>

        <div class="content-area">
            <div id="error-message" class="error-banner"></div>

            <div id="view-dashboard" class="view active">
                <div class="dashboard-grid">
                    <div class="parchment-card">
                        <h2 class="card-title">Trésor Cumulé du Royaume</h2>
                        <div class="metric-value" id="total-treasury">Chargement...</div>
                    </div>
                </div>
            </div>

            <div id="view-houses" class="view">
                <div class="houses-grid" id="houses-container">
                    <!-- Données chargées depuis PostgreSQL -->
                </div>
            </div>
        </div>
    </main>

    <!-- MODALE -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content parchment-card">
            <button class="btn-close" onclick="closeModal()">✖</button>
            <h2 class="card-title">Modifier le Registre PostgreSQL</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Nom de la Maison</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-group">
                <label>Devise</label>
                <input type="text" id="edit-motto">
            </div>
            <div class="form-group">
                <label>Trésor (Dragons d'Or)</label>
                <input type="number" id="edit-wealth">
            </div>
            <button class="btn-gold" onclick="saveHouseToSupabase()">Sceller dans la base (UPDATE)</button>
        </div>
    </div>

    <script>
        // === CONFIGURATION SUPABASE ===
        // Obtenez ces 2 valeurs dans Supabase > Project Settings > API
        const SUPABASE_URL = 'https://keeqmcmbcnltsgizwsrz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_y-ju2brRwB5fPuNzySHuzw_b6s1Tb-M'; 

        let supabase = null;
        let housesData = [];

        function displayError(msg) {
            const errBox = document.getElementById('error-message');
            errBox.style.display = 'block';
            errBox.innerHTML = `<strong>Erreur Système :</strong> ${msg}`;
        }

        // Initialisation sécurisée de Supabase
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    

        // === CHARGEMENT DEPUIS POSTGRESQL ===
        async function fetchHousesFromDB() {
            if (!supabase) return;

            try {
                const { data, error } = await supabase
                    .from('noble_houses')
                    .select('*')
                    .order('name', { ascending: true });

                if (error) throw error;

                housesData = data || [];
                renderHouses();
                updateDashboard();
            } catch (err) {
                console.error("Erreur PostgreSQL:", err);
                displayError(`Impossible de lire les données : ${err.message}`);
            }
        }

        // === ENREGISTREMENT DANS POSTGRESQL ===
        async function saveHouseToSupabase() {
            if (!supabase) return;

            const id = document.getElementById('edit-id').value;
            const updatedHouse = {
                name: document.getElementById('edit-name').value,
                motto: document.getElementById('edit-motto').value,
                treasury: parseInt(document.getElementById('edit-wealth').value) || 0,
                updated_at: new Date()
            };

            try {
                const { error } = await supabase
                    .from('noble_houses')
                    .update(updatedHouse)
                    .eq('id', id);

                if (error) throw error;

                closeModal();
                fetchHousesFromDB();
            } catch (err) {
                alert("Erreur de sauvegarde : " + err.message);
            }
        }

        // === AFFICHAGE UI ===
        function renderHouses() {
            const container = document.getElementById('houses-container');
            container.innerHTML = '';

            if (housesData.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Aucune maison noble trouvée dans la base de données.</p>';
                return;
            }

            housesData.forEach(house => {
                const card = document.createElement('div');
                card.className = 'parchment-card house-card';
                card.onclick = () => openEditModal(house.id);
                
                const nomPropre = (house.name || '').replace('Maison ', '');
                const initial = nomPropre.charAt(0).toUpperCase() || '?';

                card.innerHTML = `
                    <div class="house-header">
                        <div class="seal">${initial}</div>
                        <div>
                            <h3 style="font-family: var(--font-title); font-size: 22px;">${house.name}</h3>
                            <p style="font-style: italic; color: var(--gold-dim);">"${house.motto || ''}"</p>
                        </div>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--gold-dim); margin: 15px 0;">
                    <p><strong>Trésor :</strong> ${(house.treasury || 0).toLocaleString()} Dragons d'Or</p>
                `;
                container.appendChild(card);
            });
        }

        function updateDashboard() {
            const total = housesData.reduce((acc, h) => acc + Number(h.treasury || 0), 0);
            document.getElementById('total-treasury').innerText = total.toLocaleString() + " Dragons d'Or";
        }

        function switchView(viewName, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            const targetView = document.getElementById('view-' + viewName);
            if (targetView) targetView.classList.add('active');
            if (element) element.classList.add('active');
        }

        function openEditModal(id) {
            const house = housesData.find(h => h.id === id);
            if (!house) return;

            document.getElementById('edit-id').value = house.id;
            document.getElementById('edit-name').value = house.name;
            document.getElementById('edit-motto').value = house.motto || '';
            document.getElementById('edit-wealth').value = house.treasury || 0;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        // Lancement au chargement de la page
        document.addEventListener('DOMContentLoaded', () => {
            fetchHousesFromDB();
        });
    </script>
</body>
</html>
